name: Feature request
description: Suggest a new segment, option, or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The statusline aims to stay one dependency-light bash script. Ideas that fit that
        constraint (no daemon, no new hard dependencies) are the easiest to land.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need
      description: What are you trying to see or do that the statusline doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would it look like on the line? A rough mockup of the rendered text helps.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing options, config, or workarounds you've already tried.
    validations:
      required: false
