name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: lint + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu = the common GNU path; macos = the bash-3.2 / BSD-utility path
        # most users actually run on (BSD sed/stat/date).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y -qq shellcheck

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v jq >/dev/null 2>&1 || brew install jq
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck

      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          shellcheck --version | sed -n '1,2p'

      - name: Lint (shellcheck)
        run: bash tests/lint.sh

      - name: Golden-output tests
        run: bash tests/run.sh
