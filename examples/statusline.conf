# MountainLabs statusline — user config (update-safe)
#
# Copy this to one of:
#   ${XDG_CONFIG_HOME:-~/.config}/mountainlabs-statusline/config   (default path)
#   or point $MOUNTAINLABS_STATUSLINE_CONFIG at any file you like
# and uncomment the lines you want to change. The installer NEVER touches this
# file, so your tweaks survive every upgrade.
#
# It's sourced as shell — keep it to plain KEY=value assignments (it runs with
# the same trust as the script itself). Precedence, highest first:
#   1. environment variable   2. this file   3. built-in default
#
# IMPORTANT: quote any value containing ';' (all the R;G;B palette triples),
# otherwise the shell reads the ';' as a command separator. Numbers and single
# glyphs need no quotes.

# --- thresholds -------------------------------------------------------------
# 5h / weekly cap bars — flip color at these % of the cap:
#CTX_WARN_PCT=70      # sage -> rust
#CTX_DANGER_PCT=90    # rust -> red
# context bar — a gradient keyed on ABSOLUTE tokens (not % of window):
#CTX_GOOD_TOK=100000  # pure sage up to here (end of the "smart zone")
#CTX_RED_TOK=400000   # full red by here, then clamped (the "dumb zone")
# session cost — dollar thresholds:
#COST_WARN=5          # sage -> rust
#COST_DANGER=20       # rust -> red

# --- palette (R;G;B — MUST be quoted) ---------------------------------------
#CREAM='242;242;242'   # foreground text
#FOREST='63;81;71'     # git segment background
#STONE='113;106;86'    # folder segment background
#SLATE='73;91;108'     # model segment background
#SAGE='150;200;165'    # gauge: safe
#RUST='226;138;74'     # gauge: warning
#RED='238;108;100'     # gauge: danger
#DIM='158;158;150'     # labels / muted text
#SKY='150;180;205'     # accent: ahead
#AMBER='208;170;104'   # accent: behind
#TRACK='64;64;60'      # empty bar track

# --- effort flair glyphs ----------------------------------------------------
#EFFORT_HIGH='▲'
#EFFORT_XHIGH='▲▲'
#EFFORT_MAX='◆◆◆'
